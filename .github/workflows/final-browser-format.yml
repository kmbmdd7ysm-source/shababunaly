name: Temporary Final Browser Formatter

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/final-browser-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npx prettier --write src/services/supabase.ts src/pages/checkout/CheckoutPaymentStage.tsx e2e/browser-contract-workflows.spec.js .github/workflows/world-class-quality.yml
      - name: Commit exact formatting
        run: |
          if git diff --quiet -- src/services/supabase.ts src/pages/checkout/CheckoutPaymentStage.tsx e2e/browser-contract-workflows.spec.js .github/workflows/world-class-quality.yml; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/supabase.ts src/pages/checkout/CheckoutPaymentStage.tsx e2e/browser-contract-workflows.spec.js .github/workflows/world-class-quality.yml
          git commit -m "Format final browser contract fixes"
          git push origin HEAD:main
