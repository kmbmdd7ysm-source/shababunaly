name: One-time PR 26 Format
on:
  push:
    branches: [feat/phase1-center-vision-tracking-20261008]
    paths:
      - .github/workflows/phase1-one-time-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/phase1-center-vision-tracking-20261008
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npx prettier --write api/readiness.ts tests/centerVisionOrderTracking.test.js
      - name: Commit formatted files
        run: |
          if git diff --quiet -- api/readiness.ts tests/centerVisionOrderTracking.test.js; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/readiness.ts tests/centerVisionOrderTracking.test.js
          git commit -m "Format readiness and Center Vision order tracking tests"
          git push origin HEAD:feat/phase1-center-vision-tracking-20261008
