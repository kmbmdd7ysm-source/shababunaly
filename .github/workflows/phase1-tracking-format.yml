name: Temporary Center Vision Tracking Formatter

on:
  push:
    branches: [feat/phase1-center-vision-tracking-20261008]
    paths:
      - .github/workflows/phase1-tracking-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/phase1-center-vision-tracking-20261008
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npx prettier --write api/center-vision-order-lookup.ts src/pages/OrderDetailPage.tsx src/services/orders.ts tests/centerVisionOrderTracking.test.js
      - name: Commit exact formatter output
        run: |
          if git diff --quiet -- api/center-vision-order-lookup.ts src/pages/OrderDetailPage.tsx src/services/orders.ts tests/centerVisionOrderTracking.test.js; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/center-vision-order-lookup.ts src/pages/OrderDetailPage.tsx src/services/orders.ts tests/centerVisionOrderTracking.test.js
          git commit -m "Format Center Vision order tracking implementation"
          git push origin HEAD:feat/phase1-center-vision-tracking-20261008
