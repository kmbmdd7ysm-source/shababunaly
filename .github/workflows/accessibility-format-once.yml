name: One-time accessibility formatter
on:
  push:
    branches:
      - fix/accessibility-rtl-checkout-20261009
    paths:
      - .github/workflows/accessibility-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/accessibility-rtl-checkout-20261009
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npx prettier --write src/components/shop/ProductCard.tsx src/pages/ProductPage.tsx e2e/accessibility.spec.js src/styles/customer-experience.css src/styles/domain-customize.css src/styles/domain-commerce.css src/styles/product-experience.css
      - name: Commit formatted files and remove formatter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/accessibility-format-once.yml
          git add src/components/shop/ProductCard.tsx src/pages/ProductPage.tsx e2e/accessibility.spec.js src/styles/customer-experience.css src/styles/domain-customize.css src/styles/domain-commerce.css src/styles/product-experience.css
          git commit -m "style: apply Prettier to accessibility changes"
          git push origin HEAD:fix/accessibility-rtl-checkout-20261009
