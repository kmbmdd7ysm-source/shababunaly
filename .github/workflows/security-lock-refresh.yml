name: Security Lock Refresh

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/security-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Refresh compatible transitive dependencies
        run: npm update --package-lock-only --ignore-scripts --registry=https://registry.npmjs.org
      - name: Commit lock refresh
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh compatible transitive security patches"
          git push origin HEAD:main
