name: Temporary Final Source Verification
# verification-pass: phase3-catalog-audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/final-source-verify.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npx prettier --write coverage-scope.json vitest.config.mjs scripts/audit-coverage-scope.mjs tests/releaseInfrastructure.test.js scripts/run-coverage.mjs scripts/validate-phase3-release.mjs scripts/validate-phase3-release.mjs
      - name: Commit exact formatting if needed
        run: |
          if git diff --quiet -- coverage-scope.json vitest.config.mjs scripts/audit-coverage-scope.mjs tests/releaseInfrastructure.test.js scripts/run-coverage.mjs; then
            echo "Formatting already exact"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add coverage-scope.json vitest.config.mjs scripts/audit-coverage-scope.mjs tests/releaseInfrastructure.test.js scripts/run-coverage.mjs
            git commit -m "Format coverage gate configuration"
            git push origin HEAD:main
          fi
      - run: npm run coverage
      - run: npm run verify:source
      - run: npm run security:audit
