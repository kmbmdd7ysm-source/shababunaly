name: Patch Browser Contract Payment Plans

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-browser-contract-payment-plans.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - name: Patch payment-plan browser contracts
        shell: python
        run: |
          from pathlib import Path

          path = Path("e2e/browser-contract-workflows.spec.js")
          text = path.read_text()

          def replace_once(old, new):
              global text
              if old not in text:
                  raise SystemExit(f"Expected fragment not found: {old[:90]!r}")
              text = text.replace(old, new, 1)

          anchor = """async function chooseCountry(page, name) {"""
          reservation_helper = """async function addReservationProduct(page) {
            await page.goto('/products/nike-kobe-3-protro-halo');
            await page.getByRole('button', { name: '9', exact: true }).click();
            await page.getByRole('button', { name: /Order by reservation/i }).click();
            await page.goto('/checkout');
            await expect(page.getByRole('heading', { name: /Checkout/i })).toBeVisible();
          }
          """
          if "async function addReservationProduct(page)" not in text:
              text = text.replace(anchor, reservation_helper + anchor, 1)

          replace_once(
              "  await page.getByRole('checkbox').last().check();",
              "  await page.getByRole('checkbox', { name: /I agree to the Terms/i }).check();",
          )
          replace_once(
              "        source: 'e2e-mock',\n        order: {",
              "        source: 'e2e-mock',\n        notification: 'delivered',\n        order: {",
          )
          replace_once(
              "      await mockOrder(page, captured);\n      await addRetailProduct(page);\n      await fillAddress(page, 'Libya');",
              "      await mockOrder(page, captured);\n      await addReservationProduct(page);\n      await fillAddress(page, 'Libya');",
          )

          path.write_text(text)
      - run: npx prettier --write e2e/browser-contract-workflows.spec.js
      - name: Commit payment-plan contract repair and remove patch workflow
        run: |
          rm .github/workflows/patch-browser-contract-payment-plans.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/browser-contract-workflows.spec.js .github/workflows/patch-browser-contract-payment-plans.yml
          git commit -m "Test reservation payment plans against reservation inventory"
          git push origin HEAD:main
