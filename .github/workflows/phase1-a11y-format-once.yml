name: One-time Accessibility Format
on:
  push:
    branches: [fix/phase1-a11y-smoke-20261009]
    paths:
      - .github/workflows/phase1-a11y-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/phase1-a11y-smoke-20261009
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npx prettier --write src/components/shop/ProductCard.tsx src/pages/ProductPage.tsx e2e/accessibility.spec.js
      - name: Commit exact Prettier formatting
        run: |
          if git diff --quiet -- src/components/shop/ProductCard.tsx src/pages/ProductPage.tsx e2e/accessibility.spec.js; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/shop/ProductCard.tsx src/pages/ProductPage.tsx e2e/accessibility.spec.js
          git commit -m "Format accessibility fixes"
          git push origin HEAD:fix/phase1-a11y-smoke-20261009
