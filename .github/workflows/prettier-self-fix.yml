name: Temporary Prettier Self Fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prettier-self-fix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - name: Format touched source
        run: |
          npx prettier --write \
            api/customer-addresses.ts \
            src/types/model-viewer.d.ts \
            types/react-router-dom-shim.d.ts \
            src/components/custom/Garment3DStage.tsx \
            src/context/CartContext.tsx \
            src/context/CatalogContext.tsx \
            src/components/common/EditorialMedia.tsx \
            src/data/officialEditorialMedia.ts \
            src/pages/LabHomePage.tsx \
            src/utils/productIntelligence.ts \
            src/utils/search.ts \
            src/pages/CheckoutPage.tsx
      - name: Commit exact Prettier output
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/customer-addresses.ts src/types/model-viewer.d.ts types/react-router-dom-shim.d.ts src/components/custom/Garment3DStage.tsx src/context/CartContext.tsx src/context/CatalogContext.tsx src/components/common/EditorialMedia.tsx src/data/officialEditorialMedia.ts src/pages/LabHomePage.tsx src/utils/productIntelligence.ts src/utils/search.ts src/pages/CheckoutPage.tsx
          git commit -m "Format strict type hardening changes"
          git push origin HEAD:main
