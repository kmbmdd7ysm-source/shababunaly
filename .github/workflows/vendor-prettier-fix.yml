name: Temporary Vendor Prettier Fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/vendor-prettier-fix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npx prettier --write vendor/micromatch/index.js
      - name: Commit exact Prettier output
        run: |
          if git diff --quiet -- vendor/micromatch/index.js; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/micromatch/index.js
          git commit -m "Format patched micromatch vendor file"
          git push origin HEAD:main
