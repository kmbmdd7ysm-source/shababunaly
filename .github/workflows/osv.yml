name: OSV Dependency Scan
on:
  push: { branches: [main] }
  pull_request:
  schedule:
    - cron: '41 4 * * 3'
permissions:
  contents: read
  security-events: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: osv
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@f4cfcc01edc9c8b756a9b873b7a623ca674da51e # v2.2.2
        with:
          scan-args: |-
            --lockfile=package-lock.json
            --format=sarif
            --output=results.sarif
      - name: Summarize OSV findings
        if: always()
        run: |
          node <<'NODE'
          const fs = require('fs');
          if (!fs.existsSync('results.sarif')) {
            console.error('results.sarif was not produced');
            process.exit(1);
          }
          const sarif = JSON.parse(fs.readFileSync('results.sarif', 'utf8'));
          const runs = sarif.runs || [];
          let total = 0;
          for (const run of runs) {
            const rules = new Map((run.tool?.driver?.rules || []).map((rule) => [rule.id, rule]));
            for (const result of run.results || []) {
              total += 1;
              const rule = rules.get(result.ruleId) || {};
              const pkg = result.properties?.package || result.properties?.packageName || '';
              const version = result.properties?.version || '';
              const msg = result.message?.text || rule.shortDescription?.text || '';
              console.log(`OSV_FINDING rule=${result.ruleId || 'unknown'} package=${pkg} version=${version} message=${msg}`);
            }
          }
          console.log(`OSV_TOTAL_FINDINGS=${total}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT || '/dev/null', `count=${total}\n`);
          NODE
        id: osv_summary
      - uses: github/codeql-action/upload-sarif@6c2f101c6fa32380a686d71a3e678f84d12c8f71 # v4.37.7
        if: always()
        with: { sarif_file: results.sarif }
      - name: Enforce zero OSV findings
        if: always()
        run: |
          test "${{ steps.osv_summary.outputs.count }}" = "0"
