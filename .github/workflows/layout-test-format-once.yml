name: One-time mobile layout test formatter
on:
  push:
    branches:
      - fix/accessibility-rtl-checkout-20261009
    paths:
      - .github/workflows/layout-test-format-once.yml

permissions:
  contents: write
  actions: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/accessibility-rtl-checkout-20261009
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npx prettier --write tests/phase2DestructionPass.test.js
      - name: Commit formatted test and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/layout-test-format-once.yml
          git add tests/phase2DestructionPass.test.js
          git commit -m "test: make mobile breakpoint invariants formatting-independent"
          git push origin HEAD:fix/accessibility-rtl-checkout-20261009
      - name: Run full quality gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run world-class-quality.yml --ref fix/accessibility-rtl-checkout-20261009
