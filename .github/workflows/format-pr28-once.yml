name: One-time format PR 28
on:
  push:
    branches:
      - fix/cloud-order-integrity-and-readiness-20261008
    paths:
      - .github/workflows/format-pr28-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/cloud-order-integrity-and-readiness-20261008
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npx prettier --write api/readiness.ts src/services/orders.ts tests/readinessApi.test.js tests/orderCloudIntegrity.test.js
      - name: Commit format and remove one-time formatter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-pr28-once.yml
          git add api/readiness.ts src/services/orders.ts tests/readinessApi.test.js tests/orderCloudIntegrity.test.js
          git commit -m "style: format checkout safety and readiness regression fixes"
          git push origin HEAD:fix/cloud-order-integrity-and-readiness-20261008
