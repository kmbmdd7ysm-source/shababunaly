name: Direct Security Lock Refresh
# regenerate after removing redundant yocto override

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/direct-security-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Use repository-pinned npm
        run: npm install --global npm@10.9.2 --registry=https://registry.npmjs.org
      - name: Regenerate lockfile for security tooling upgrades
        run: |
          rm -f package-lock.json
          npm --version
          npm install --package-lock-only --ignore-scripts --registry=https://registry.npmjs.org
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already synchronized"
            exit 0
          fi
          git commit -m "Lock upgraded security tooling"
          git push origin HEAD:main
