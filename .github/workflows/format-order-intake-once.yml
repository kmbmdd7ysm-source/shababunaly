name: One-time order-intake formatter
on:
  push:
    branches:
      - fix/cloud-order-integrity-and-readiness-20261008
    paths:
      - .github/workflows/format-order-intake-once.yml

permissions:
  contents: write
  actions: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/cloud-order-integrity-and-readiness-20261008
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npx prettier --write api/order-intake.ts
      - name: Commit corrected source and remove one-time formatter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-order-intake-once.yml
          git add api/order-intake.ts
          git commit -m "style: format protected order intake API"
          git push origin HEAD:fix/cloud-order-integrity-and-readiness-20261008
      - name: Run full quality gate on formatted branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run world-class-quality.yml --ref fix/cloud-order-integrity-and-readiness-20261008
