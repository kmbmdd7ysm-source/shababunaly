name: Temporary Catalog Regeneration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/catalog-regenerate.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npm run catalog:generate
      - name: Commit generated trusted catalog
        run: |
          if git diff --quiet -- supabase/generated/product_catalog.sql; then
            echo "Catalog already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/generated/product_catalog.sql
          git commit -m "Regenerate trusted product catalog"
          git push origin HEAD:main
