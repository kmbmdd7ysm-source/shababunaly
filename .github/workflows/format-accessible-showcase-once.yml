name: One-time accessible showcase formatter
on:
  push:
    branches:
      - fix/accessibility-rtl-checkout-20261009
    paths:
      - .github/workflows/format-accessible-showcase-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/accessibility-rtl-checkout-20261009
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npx prettier --write src/components/custom/CustomProductShowcase.tsx
      - name: Commit formatted JSX and self-remove formatter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-accessible-showcase-once.yml
          git add src/components/custom/CustomProductShowcase.tsx
          git commit -m "style: format accessible customization preview"
          git push origin HEAD:fix/accessibility-rtl-checkout-20261009
