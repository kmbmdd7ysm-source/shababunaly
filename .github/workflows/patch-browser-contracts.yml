name: Patch Browser Contracts

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-browser-contracts.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - name: Patch stale browser-contract locators and order boundary
        shell: python
        run: |
          from pathlib import Path

          path = Path("e2e/browser-contract-workflows.spec.js")
          text = path.read_text()

          def replace_once(old, new):
              global text
              if old not in text:
                  raise SystemExit(f"Expected browser-contract fragment not found: {old[:90]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              "  await page.getByLabel('Email').fill(email);\n  await page.getByLabel('Password').fill(password);",
              "  await page.getByRole('textbox', { name: 'Email', exact: true }).fill(email);\n  await page.locator('input[autocomplete=\"current-password\"]').fill(password);",
          )
          replace_once(
              "  await page.getByRole('radio', { name: 'M' }).click();\n  await page.getByRole('button', { name: /Add to cart/i }).click();",
              "  await page.getByRole('button', { name: 'M', exact: true }).click();\n  await page.getByRole('button', { name: /Add to (?:bag|cart)/i }).click();",
          )
          replace_once(
              "  await page.getByLabel('Email').fill('checkout@example.com');",
              "  await page.getByRole('textbox', { name: 'Email', exact: true }).fill('checkout@example.com');",
          )
          replace_once(
              "  await page.route('**/api/create-order', async (route) => {\n    const body = route.request().postDataJSON();\n    capture.push(body);\n    const plan = body.paymentPlan;\n    const total = Number(body.total || 20);",
              "  await page.route('**/api/order-intake', async (route) => {\n    const body = route.request().postDataJSON();\n    const shipping = body.shipping || {};\n    const capturedOrder = {\n      ...body,\n      paymentPlan: shipping.paymentPlan,\n      shippingQuoteRequired: shipping.shippingQuoteRequired,\n      deliveryProfile: shipping.deliveryProfile,\n    };\n    capture.push(capturedOrder);\n    const plan = capturedOrder.paymentPlan;\n    const total = 20;",
          )
          replace_once(
              "          shippingQuoteRequired: body.shippingQuoteRequired,\n          deliveryProfile: body.deliveryProfile,",
              "          shippingQuoteRequired: capturedOrder.shippingQuoteRequired,\n          deliveryProfile: capturedOrder.deliveryProfile,",
          )
          replace_once(
              "      await page.getByLabel('Email').fill(email);\n      await page.getByLabel('Password').fill(password);\n      await page.getByLabel('Confirm new password').fill(password);",
              "      await page.getByRole('textbox', { name: 'Email', exact: true }).fill(email);\n      const signupPasswords = page.locator('input[autocomplete=\"new-password\"]');\n      await signupPasswords.first().fill(password);\n      await signupPasswords.last().fill(password);",
          )
          replace_once(
              "      await page.getByLabel('Email').fill(user.email);",
              "      await page.getByRole('textbox', { name: 'Email', exact: true }).fill(user.email);",
          )
          replace_once(
              "    await expect(page.getByRole('heading', { name: 'Teams & Wholesale' })).toBeVisible();",
              "    await expect(page.getByRole('heading', { name: 'Build your program.' })).toBeVisible();",
          )

          path.write_text(text)
      - run: npx prettier --write e2e/browser-contract-workflows.spec.js
      - name: Commit browser-contract repair and remove patch workflow
        run: |
          rm .github/workflows/patch-browser-contracts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/browser-contract-workflows.spec.js .github/workflows/patch-browser-contracts.yml
          git commit -m "Align browser contract tests with current storefront UI"
          git push origin HEAD:main
