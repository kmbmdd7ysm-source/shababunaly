<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <meta name="color-scheme" content="light" />
    <meta
      data-rh="true"
      name="description"
      content="SHABABUNA — premium basketball retail, custom manufacturing, team supply, wholesale and equipment. Built Different in Libya for the world."
    />
    <meta data-rh="true" name="robots" content="index, follow, max-image-preview:large" />
    <link data-rh="true" rel="canonical" href="https://shababuna.ly/" />
    <meta data-rh="true" property="og:site_name" content="SHABABUNA" />
    <meta data-rh="true" property="og:type" content="website" />
    <meta data-rh="true" property="og:url" content="https://shababuna.ly/" />
    <meta data-rh="true" property="og:title" content="SHABABUNA | BUILT DIFFERENT" />
    <meta
      data-rh="true"
      property="og:description"
      content="Basketball retail, custom manufacturing, teams, wholesale and equipment — from Libya to the world."
    />
    <meta
      data-rh="true"
      property="og:image"
      content="https://shababuna.ly/brand/shababuna-social.png"
    />
    <meta data-rh="true" property="og:image:width" content="1200" />
    <meta data-rh="true" property="og:image:height" content="630" />
    <meta data-rh="true" property="og:image:type" content="image/png" />
    <meta data-rh="true" property="og:locale" content="en_US" />
    <meta data-rh="true" property="og:locale:alternate" content="ar_LY" />
    <meta data-rh="true" name="twitter:card" content="summary_large_image" />
    <meta data-rh="true" name="twitter:title" content="SHABABUNA | BUILT DIFFERENT" />
    <meta
      data-rh="true"
      name="twitter:description"
      content="Premium basketball retail, custom manufacturing, teams, wholesale and equipment."
    />
    <meta
      data-rh="true"
      name="twitter:image"
      content="https://shababuna.ly/brand/shababuna-social.png"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="mask-icon" href="/favicon.svg" color="#050505" />
    <link rel="manifest" href="/site.webmanifest" />
    <link
      rel="preload"
      as="image"
      href="/media/heroes/home-desktop.webp"
      imagesrcset="/media/heroes/home-mobile.webp 900w, /media/heroes/home-desktop.webp 1600w"
      imagesizes="100vw"
      fetchpriority="high"
    />
    <style>
      /* Critical LCP shell — paints before JS; absolute so late removal avoids CLS */
      html,
      body {
        margin: 0;
        background: #050505;
      }
      #lcp-shell.gw-hero-ssr {
        /* Fixed overlay so it remains the LCP candidate until retired */
        position: fixed;
        inset: 0 0 auto 0;
        z-index: 9999;
        width: 100%;
        height: min(78vh, 820px);
        background: #050505;
        overflow: hidden;
        pointer-events: none;
      }
      #lcp-shell.gw-hero-ssr.is-retiring {
        opacity: 0;
        transition: opacity 240ms ease;
      }

      #lcp-shell .gw-hero-poster {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #root {
        position: relative;
        z-index: 1;
      }
      .skip-link {
        position: absolute;
        left: -9999px;
      }
    </style>
    <!-- Self-hosted faces are declared in src/styles/fonts.css and are deliberately
         NOT preloaded yet: no live route paints them, so a preload would cost every
         visitor ~36 KB for nothing and would compete with the hero poster above for
         LCP priority. The preload lands with the phase that adopts the typography
         site-wide; until then the faces load on demand, which today means only on
         the /lab/home prototype. -->
    <title>SHABABUNA | BUILT DIFFERENT</title>
  </head>
  <body>
    <a id="skip-link" class="skip-link" href="#main-content">Skip to content</a>
    <!--
      Static LCP shell OUTSIDE #root so React mount does not reset LCP.
      Home retires it after the LCP window; non-home routes remove immediately.
    -->
    <section id="lcp-shell" class="gw-hero-ssr" aria-hidden="true">
      <img
        class="gw-hero-poster"
        src="/media/heroes/home-desktop.webp"
        width="1600"
        height="900"
        fetchpriority="high"
        decoding="sync"
        alt=""
      />
    </section>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
